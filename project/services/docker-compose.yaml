services:
  # create bucket on start
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    networks:
      - mlops-net
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/mlflow-artifacts;
        mc mb --ignore-existing local/datasets;
        mc anonymous set download local/datasets;
        echo 'MinIO buckets ready';
      "

  # MinIO
  minio:
    image: minio/minio:latest
    user: "0:0"
    container_name: minio
    networks:
      - mlops-net
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: http://${MINIO_GLOBAL_HOST}:9000
    volumes:
      - ${MINIO_DATA_PATH}:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-4}"
          memory: "${MEMORY_LIMIT:-12G}"

  # Label Studio
  labelstudio:
    image: heartexlabs/label-studio:latest
    user: "0:0"
    container_name: labelstudio
    networks:
      - mlops-net
    restart: unless-stopped
    ports:
      - "${LABELSTUDIO_PORT:-8081}:8081"
    command: label-studio start --host 0.0.0.0 --port 8081 --no-browser
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ML_TIMEOUT_PREDICT: 1200
      ML_TIMEOUT_SETUP: 10
      ML_CONNECTION_TIMEOUT: 5
      DJANGO_DB: sqlite
      DEBUG: "true"
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
      INACTIVITY_SESSION_TIMEOUT_ENABLED: 0
      SSRF_PROTECTION_ENABLED: "true"
      LOCAL_FILES_SERVING_ENABLED: "true"
#      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /data/local-files
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD}
      # Label Studio searching MinIO by container name
      MINIO_STORAGE_ENDPOINT_URL: http://minio:9000
      MINIO_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      # for ubuntu
      - ${LS_DATA_PATH}:/label-studio/data
      # for windows
#      - D:/:/data/local-files:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-1}"
          memory: "${MEMORY_LIMIT:-2048M}"

  # Reserve Label Studio for annotators. A backup service for people to access new
  # data markup when hiring on an outsourced basis.
  labelstudio-reserve:
    image: heartexlabs/label-studio:latest
    user: "0:0"
    container_name: labelstudio-reserve
    networks:
      - mlops-net
    restart: unless-stopped
    ports:
      - "${LABELSTUDIO_RESERVE_PORT:-8083}:8083"
    command: label-studio start --host 0.0.0.0 --port 8083 --no-browser
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ML_TIMEOUT_PREDICT: 1200
      ML_TIMEOUT_SETUP: 10
      ML_CONNECTION_TIMEOUT: 5
      DJANGO_DB: sqlite
      DEBUG: "true"
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
      INACTIVITY_SESSION_TIMEOUT_ENABLED: 0
      SSRF_PROTECTION_ENABLED: "true"
      LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD}
      # Label Studio searching MinIO by container name
      MINIO_STORAGE_ENDPOINT_URL: http://minio:9000
      MINIO_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${LS_DATA_PATH_RESERVE}:/label-studio/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-1}"
          memory: "${MEMORY_LIMIT:-2048M}"

  # Label Studio auto labeling
  ml-backend:
    image: humansignal/auto-pose-labeling:v0
    container_name: ml-backend
    networks:
      - mlops-net
    restart: unless-stopped
    build:
      context: ./ml_backend
      args:
        TEST_ENV: ${TEST_ENV}
    environment:
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - WORKERS=${WORKERS:-1}
      - THREADS=${THREADS:-8}
      # inner variables
      - MODEL_DIR=${MODEL_DIR:-/app/models}
      - LABEL_STUDIO_URL=${LABEL_STUDIO_URL}
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - MMPOSE_CHECKPOINT=${MMPOSE_CHECKPOINT}
      - MMPOSE_CONFIG=${MMPOSE_CONFIG}
      - YOLO_MODEL=${YOLO_MODEL}
      - DEVICE=${DEVICE:-cuda}
      - ALLOWED_LABEL_FIELDS=label_body_keypoints,label_foot_keypoints,label_left_hand_keypoints,label_right_hand_keypoints
      - MIN_BBOX_AREA_RATIO=${MIN_BBOX_AREA_RATIO:-0.}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD:-0.}
      - KPT_THRESHOLD=${KPT_THRESHOLD:-0.}
      - READY_WAIT_TIMEOUT_S=${READY_WAIT_TIMEOUT_S:-120}
      - MODEL_VERSION-${MODEL_VERSION:-v1.0.0}
    ports:
      - "${ML_BACKEND_PORT:-9090}:9090"
    depends_on:
      labelstudio:
        condition: service_healthy
    volumes:
      - ${LS_ML_DATA_PATH}:/app/models
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9090/health-ready" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-4}"
          memory: "${MEMORY_LIMIT:-2048M}"
        reservations:
          cpus: "${CPU_RESERVATION:-1}"
          memory: "${MEMORY_RESERVATION:-2048M}"
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
                - utility
                - compute
                - video

  # MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    networks:
      - mlops-net
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-8082}:8082"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${MLFLOW_DATA_PATH}:/mlflow
    entrypoint: >
      /bin/sh -c "pip install boto3 && mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://mlflow-artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 8082
      --allowed-hosts '*'
      --cors-allowed-origins '*'"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-1}"
          memory: "${MEMORY_LIMIT:-4096M}"

networks:
  mlops-net:
    driver: bridge
