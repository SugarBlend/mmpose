stages:
  fetch:
    foreach: ${datasets}
    do:
      cmd: >-
        python -c
        "import subprocess, os, json;
        src = 'minio/${item.ann_relative_path}';
        dst = 'standard/${key}';
        os.makedirs(dst, exist_ok=True);
        r = subprocess.run(['mc', 'ls', '--json', src], capture_output=True, text=True, check=True);
        files = [json.loads(l)['key'] for l in r.stdout.splitlines() if l.strip() and json.loads(l).get('key', '').endswith('.json')];
        [subprocess.run(['mc', 'cp', src.rstrip('/') + '/' + f, dst], check=True) for f in files]
        "
      outs:
        - standard/${key}:
            cache: false

  convert_ls_to_coco:
    # permanent link to "datasets" bucket in S3/Minio storage
    cmd: >
      python ../label_studio/tasks2json.py --root-dataset-path s3://datasets --output_folder ${convert.ls_output_folder}
      --patterns "${convert.search_patterns}"

    deps:
      - ../label_studio/tasks2json.py
    params:
      - convert.search_patterns
      - convert.ls_output_folder
    outs:
      - ${convert.ls_output_folder}:
          cache: false

  split_coco:
    cmd: >
      python ../label_studio/coco_split.py 
      --annotations_dir ${convert.ls_output_folder} 
      --output_dir ${convert.user_output_folder} 
      --train_ratio ${split.train_ratio} 
      --val_ratio ${split.val_ratio} 
      --test_ratio ${split.test_ratio} 
      --seed ${split.seed} 
      --patterns "${convert.search_patterns}"
      --split_mode ${split.mode}
    deps:
      - ../label_studio/coco_split.py
      - ${convert.ls_output_folder}
    params:
      - split.train_ratio
      - split.val_ratio
      - split.test_ratio
      - split.seed
      - split.mode
      - convert.search_patterns
      - convert.ls_output_folder
      - convert.user_output_folder
    outs:
      - ${convert.user_output_folder}/train.json
      - ${convert.user_output_folder}/val.json
      - ${convert.user_output_folder}/test.json
